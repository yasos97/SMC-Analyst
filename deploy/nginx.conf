# SalamaIQ — Reverse proxy nginx
# Copier vers : /etc/nginx/sites-available/salamaiq
# Activer : sudo ln -s /etc/nginx/sites-available/salamaiq /etc/nginx/sites-enabled/
# Tester   : sudo nginx -t  puis  sudo systemctl reload nginx
# Remplacer mondomaine.com par votre domaine.

server {
    listen 80;
    server_name mondomaine.com www.mondomaine.com;

    # Taille max des uploads (doit être >= MAX_CONTENT_LENGTH de Flask = 50 Mo)
    client_max_body_size 50m;

    # Fichiers statiques servis directement par nginx (perf)
    location /static/ {
        alias /opt/salamaiq/static/;
        expires 7d;
        access_log off;
    }

    # Tout le reste → Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# Après avoir lancé certbot (voir DEPLOY.md), il ajoute automatiquement
# le bloc HTTPS (listen 443 ssl) et la redirection 80 → 443.
